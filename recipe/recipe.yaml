context:
  version: "1.15.1"

package:
  name: bibtex-tidy
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/bibtex-tidy/-/bibtex-tidy-${{ version }}.tgz
  sha256: f911be78ea301c6079f9a90c3c1a42b7c85d130dbbf73fd80a462532fc8b20b8

build:
  number: 0
  noarch: generic

requirements:
  host:
    - nodejs
  run:
    - nodejs

tests:
  - script:
      - bibtex-tidy --help

about:
  license: MIT
  license_file: LICENSE
  summary: Cleaner and Formatter for BibTeX files
  homepage: https://github.com/FlamingTempura/bibtex-tidy
  repository: https://github.com/FlamingTempura/bibtex-tidy

extra:
  recipe-maintainers:
    - danielnachun
