context:
  version: "1.15.0"

package:
  name: bibtex-tidy
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/bibtex-tidy/-/bibtex-tidy-${{ version }}.tgz
  sha256: cebe51d16c99a9881d33d52fbd477d4c2c808ca01cc33a04e0437e999a352e09

build:
  number: 0
  noarch: generic

requirements:
  host:
    - nodejs
  run:
    - nodejs

tests:
  - script:
      - bibtex-tidy --help

about:
  license: MIT
  license_file: LICENSE
  summary: Cleaner and Formatter for BibTeX files
  homepage: https://github.com/FlamingTempura/bibtex-tidy
  repository: https://github.com/FlamingTempura/bibtex-tidy

extra:
  recipe-maintainers:
    - danielnachun
